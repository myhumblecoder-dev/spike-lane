<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spike Studio">
<title>Spike Studio</title>
<style>
/* A screening-room studio: warm dark by default, a paper light theme when the phone asks for it.
   One column on a phone, the same column centered on a desktop. */
:root {
  --bg: #16120f; --panel: #221c17; --panel-2: #2c241e; --line: #3a3029; --fg: #f3ebe0; --dim: #b4a593;
  --faint: #7d6f61; --accent: #f0b54a; --accent-ink: #1d1508; --ok: #8fcf8a; --bad: #ef8a78; --run: #7fb8e8;
  --radius: 10px; --gap: 14px;
  --display: ui-serif, "New York", Georgia, serif;
  --body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f6f0e6; --panel: #fffaf2; --panel-2: #f0e7d9; --line: #e2d5c2; --fg: #2a211a; --dim: #6d5f50;
    --faint: #9a8b79; --accent: #c7851a; --accent-ink: #fffaf2; --ok: #2f7d35; --bad: #b73e2b; --run: #2b6ea8;
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font: 16px/1.5 var(--body); -webkit-text-size-adjust: 100%; padding-bottom: calc(40px + env(safe-area-inset-bottom)); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
.wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }

/* top bar */
header.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top); }
.top .wrap { display: flex; align-items: center; gap: 10px; min-height: 52px; }
.brand { font: 700 1.15rem/1 var(--display); letter-spacing: .01em; white-space: nowrap; }
.brand b { color: var(--accent); }
.crumb { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
.back { background: none; border: 0; padding: 8px 6px 8px 0; color: var(--accent); cursor: pointer; font-size: 1rem; }

/* tabs */
nav.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button { flex: none; border: 1px solid var(--line); background: var(--panel); color: var(--dim);
  padding: 7px 14px; border-radius: 999px; cursor: pointer; font-size: .92rem; }
nav.tabs button[aria-current="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
nav.tabs button .n { color: var(--faint); margin-right: 4px; font-variant-numeric: tabular-nums; }
nav.tabs button[aria-current="true"] .n { color: inherit; opacity: .6; }

/* basics */
h1 { font: 700 clamp(1.8rem, 6vw, 2.6rem)/1.05 var(--display); margin: 18px 0 4px; text-wrap: balance; }
h2 { font: 600 1.2rem/1.2 var(--display); margin: 26px 0 10px; }
h3 { font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin: 18px 0 8px; font-weight: 600; }
p { margin: 0 0 10px; }
.dim { color: var(--dim); } .faint { color: var(--faint); } .small { font-size: .88rem; }
.mono { font-family: var(--mono); font-size: .85rem; }
.stack { display: grid; gap: var(--gap); }
.stack > *, details.sec > .body > *, details.sec > summary > * { min-width: 0; }  /* long unbroken text must not widen the page */
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; min-width: 0; }
.hint { background: var(--panel-2); border-radius: var(--radius); padding: 12px 14px; color: var(--dim); font-size: .93rem; }

/* controls */
.btn { border: 1px solid var(--line); background: var(--panel-2); padding: 10px 16px; border-radius: 999px;
  cursor: pointer; font-weight: 600; font-size: .95rem; display: inline-flex; gap: 8px; align-items: center; min-height: 42px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.small { padding: 6px 12px; min-height: 34px; font-size: .86rem; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .45; cursor: default; }
label.f { display: grid; gap: 5px; font-size: .86rem; color: var(--dim); min-width: 0; }
label.f > span { display: flex; justify-content: space-between; gap: 8px; }
input[type=text], input[type=number], textarea, select {
  width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  color: var(--fg); font-size: 16px; /* 16px stops iOS zooming on focus */ }
textarea { resize: vertical; min-height: 64px; line-height: 1.45; }
textarea.code { font-family: var(--mono); font-size: 13px; min-height: 60vh; white-space: pre; }
input:focus, textarea:focus, select:focus { outline: 2px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 1px; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 520px) { .grid2.collapse, .grid3.collapse { grid-template-columns: 1fr; } }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 7px 14px; cursor: pointer; color: var(--dim); font-size: .9rem; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.scene-strip { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: thin; }
.scene-pill { flex: none; width: 92px; display: grid; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--panel); color: var(--fg); font: inherit; cursor: pointer; text-align: left; }
.scene-pill img, .scene-pill .ph { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 6px; display: block; background: var(--line); }
.scene-pill .lbl { font-size: .82rem; padding: 0 2px; }
.scene-pill[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.scene-pill.ok { border-color: color-mix(in srgb, var(--ok) 50%, var(--line)); }
.scene-pill.locked { opacity: .55; }
.scene-pill.add .ph { display: grid; place-items: center; font-size: 1.4rem; color: var(--dim); background: transparent; border: 1px dashed var(--line); }
details.part > summary { display: flex; align-items: center; gap: 10px; }
details.part > summary .chip { margin-left: auto; }
details.part.current { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
details.part > .body { display: grid; gap: 10px; }
details.part video, details.part .thumb { width: 100%; max-height: 62vh; object-fit: contain; background: #0001; border-radius: 8px; display: block; }
.heard { margin: 0; font-style: italic; }
.check { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.voice-card { cursor: pointer; }
.voice-card:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.voice-card[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.linkish { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); text-decoration: underline; cursor: pointer; }

/* media */
img, video { display: block; width: 100%; border-radius: 8px; background: #000; }
video.film { aspect-ratio: 832 / 448; }
audio { width: 100%; height: 40px; }
.thumb { aspect-ratio: 1248 / 720; object-fit: cover; }
.empty-media { aspect-ratio: 1248 / 720; border-radius: 8px; border: 1px dashed var(--line); display: grid; place-items: center;
  color: var(--faint); font-size: .88rem; background: var(--panel-2); }

/* films list */
.films { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr)); gap: var(--gap); }
.film-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
  cursor: pointer; text-align: left; padding: 0; display: grid; }
.film-card img, .film-card .empty-media { border-radius: 0; }
.film-card .meta { padding: 10px 12px 12px; display: grid; gap: 2px; }
.film-card b { font: 600 1.05rem/1.2 var(--display); }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: .78rem; padding: 2px 9px; border-radius: 999px;
  background: var(--panel-2); color: var(--dim); white-space: nowrap; }
.chip.ok { color: var(--ok); } .chip.bad { color: var(--bad); } .chip.run { color: var(--run); }
.chip.acc { background: var(--accent); color: var(--accent-ink); }

/* job bar */
.job { position: sticky; top: calc(53px + env(safe-area-inset-top)); z-index: 15; margin: 10px 0 0; }
.job .card { display: grid; gap: 6px; padding: 10px 14px; border-color: color-mix(in srgb, var(--run) 50%, var(--line)); }
.job.done .card { border-color: color-mix(in srgb, var(--ok) 50%, var(--line)); }
.job.failed .card { border-color: color-mix(in srgb, var(--bad) 60%, var(--line)); }
.job .last { font-family: var(--mono); font-size: .8rem; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.job pre { margin: 0; max-height: 40vh; overflow: auto; font: .78rem/1.4 var(--mono); color: var(--dim); white-space: pre-wrap; word-break: break-word; }
.pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--run); animation: pulse 1.4s ease-in-out infinite; flex: none; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }

/* board */
.board { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(250px, 100%), 1fr)); gap: var(--gap); align-items: start; }
.board > *, .films > * { min-width: 0; }
.shot-card { display: grid; gap: 8px; }
.shot-card .id { font: 600 .82rem/1 var(--mono); color: var(--accent); }
.retakes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.retakes figure { margin: 0; display: grid; gap: 4px; }
.retakes figcaption { display: flex; justify-content: space-between; align-items: center; gap: 4px; flex-wrap: wrap; font-size: .78rem; color: var(--dim); }
.retakes figcaption .btn { padding: 4px 10px; min-height: 30px; }
.stale { position: relative; }
.stale::after { content: "out of date"; position: absolute; top: 6px; left: 6px; font-size: .72rem; padding: 2px 7px;
  border-radius: 999px; background: var(--bad); color: #fff; }

/* story editor */
details.sec { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
details.sec > summary { list-style: none; cursor: pointer; padding: 13px 14px; display: flex; gap: 10px; align-items: center; }
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary::after { content: "›"; margin-left: auto; color: var(--faint); font-size: 1.3rem; line-height: 1; transition: transform .15s; }
details.sec[open] > summary::after { transform: rotate(90deg); }
details.sec > .body { padding: 0 14px 14px; display: grid; gap: 12px; }
.sum-title { font-weight: 600; flex: none; max-width: 45%; } .sum-sub { flex: 1; color: var(--dim); font-size: .88rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.line-row { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr) auto; gap: 8px; align-items: start; }
@media (max-width: 520px) { .line-row { grid-template-columns: 1fr auto; } .line-row .line-text { grid-column: 1 / -1; grid-row: 2; } }
.savebar { position: sticky; bottom: 0; z-index: 10; padding: 12px 0 calc(12px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--bg) 70%, transparent); }
.errors { color: var(--bad); font-size: .92rem; white-space: pre-wrap; }

/* lists */
.lines { display: grid; gap: 10px; }
.line { display: grid; gap: 6px; padding: 12px 0; border-top: 1px solid var(--line); }
.who { font-size: .76rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--accent); }
.said { font: italic 1.02rem/1.4 var(--display); }
.take { display: grid; gap: 8px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 50;
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: .92rem; max-width: calc(100vw - 32px);
  box-shadow: 0 8px 30px rgba(0,0,0,.35); }
.toast.bad { background: var(--bad); color: #fff; }
.center { text-align: center; padding: 40px 0; }
nav.tabs button .st { margin-left: 5px; font-size: .8rem; }
nav.tabs button.ok .st { color: var(--ok); } nav.tabs button.locked { opacity: .55; }
.gatebar { position: sticky; bottom: 0; z-index: 10; padding: 12px 0 calc(12px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--bg) 75%, transparent); }
.gatebar .card { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.gatebar.ok .card { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
.style-pick { display: flex; gap: 12px; align-items: center; }
.style-pick img { width: 120px; aspect-ratio: 16 / 10; object-fit: cover; flex: none; }
.inline { display: grid; gap: 6px; }
.inline .row { justify-content: flex-end; }
</style>
</head>
<body>
<header class="top"><div class="wrap" id="topbar"></div></header>
<main class="wrap" id="app"></main>
<script>
"use strict";
// ---- tiny helpers ---------------------------------------------------------------------------------
const $app = document.getElementById("app"), $top = document.getElementById("topbar");
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k.startsWith("aria-") && typeof v === "boolean") { el.setAttribute(k, String(v)); continue; }
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "value") el.value = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return el;
}
async function api(method, path, body) {
  const r = await fetch(path, { method, headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error((data.errors || [r.statusText]).join("\n")), { data, status: r.status });
  return data;
}
let toastTimer;
function toast(msg, bad) {
  document.querySelector(".toast")?.remove();
  const t = h("div", { class: "toast" + (bad ? " bad" : ""), role: "status" }, msg);
  document.body.append(t); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), bad ? 6000 : 2600);
}
const media = (url) => url ? `/media/${S.name}/${url}` : null;
const clone = (x) => JSON.parse(JSON.stringify(x));
const fmtSecs = (s) => s >= 60 ? `${Math.floor(s / 60)} min ${String(s % 60).padStart(2, "0")} s` : `${s} s`;
const STEP_NAMES = { new: "Writing the story", board: "Drawing the pictures", retake: "Drawing retakes", video: "Animating the shots",
  sound: "Adding sound effects", voices: "Recording voices", scene: "Putting the scene together", check: "Checking the picture", motioncheck: "Checking the motion", look: "Drawing the look", voice: "Designing the voice", music: "Scoring the music",
  film: "Mixing the film", status: "Status" };

// ---- state ----------------------------------------------------------------------------------------
const S = { name: null, film: null, doc: null, dirty: false, tab: "story", raw: false, rawText: "", errors: [], poll: null, openShot: null, logOpen: false };

function route() {
  const m = location.hash.match(/^#\/film\/([a-z0-9-]+)(?:\/(\w+)(?:\/([a-z0-9-]+))?)?/);
  clearTimeout(S.poll);
  if (m) {
    if (S.name !== m[1]) Object.assign(S, { name: m[1], film: null, doc: null, dirty: false, raw: false, errors: [], openShot: null, voiceFilter: null });
    S.tab = m[2] || S.tab || "story";
    S.scene = m[3] || null;
    loadFilm();
  } else { S.name = null; home(); }
}
window.addEventListener("hashchange", route);
window.addEventListener("beforeunload", (e) => { if (S.dirty) { e.preventDefault(); e.returnValue = ""; } });

// ---- home -----------------------------------------------------------------------------------------
async function home() {
  $top.replaceChildren(h("div", { class: "brand" }, "Spike ", h("b", {}, "Studio")));
  $app.replaceChildren(h("p", { class: "center dim" }, "Loading…"));
  let films = [];
  try { films = await api("GET", "/api/films"); } catch (e) { toast(e.message, true); }
  const shots = h("input", { type: "number", min: 3, max: 16, value: 6, inputmode: "numeric" });
  const title = h("input", { type: "text", placeholder: "e.g. Penguin Ice Cream", autocomplete: "off" });
  const idea = h("textarea", { rows: 6, placeholder: "A one-line idea, or your whole story, dialogue and all. The writer follows your story beat by beat and keeps your lines word for word." });
  const notes = h("textarea", { rows: 3, placeholder: "Optional: names, looks, setting, tone, who talks, how it ends." });
  const styleIn = h("input", { type: "file", accept: "image/png,image/jpeg", hidden: true });
  const noPic = () => h("div", { class: "empty-media" }, "No picture");
  const stylePrev = h("div", { style: "width:120px;flex:none" }, noPic());
  const styleNote = h("span", { class: "small dim" }, "Optional: a picture in the style you want. The local model reads its style (medium, colours, lines, texture) and every still copies it.");
  const styleClear = h("button", { class: "btn small ghost", hidden: true, onclick: () => { styleIn.value = ""; styleIn.dispatchEvent(new Event("change")); } }, "Remove");
  styleIn.addEventListener("change", () => {
    const file = styleIn.files[0];
    styleClear.hidden = !file;
    stylePrev.replaceChildren(file ? h("img", { src: URL.createObjectURL(file), alt: "Style picture", style: "width:120px;aspect-ratio:16/10;object-fit:cover" }) : noPic());
  });
  const styleBox = h("div", { class: "style-pick" }, stylePrev, h("div", { class: "stack", style: "gap:6px;min-width:0" }, styleNote,
    h("div", { class: "row" }, h("button", { class: "btn small", onclick: () => styleIn.click() }, "Choose picture"), styleClear, styleIn)));
  const part = (label, note) => { const c = h("input", { type: "checkbox", checked: true }); return [c, h("label", { class: "check" }, c, h("span", {}, label, h("span", { class: "faint" }, ` ${note}`)))]; };
  const [narrOn, narrBox] = part("Narrator", "a voice telling the story");
  const [talkOn, talkBox] = part("Characters talk", "dialogue in their own voices");
  const [musicOn, musicBox] = part("Music", "a score under the whole film");
  const lookSel = h("select", { "aria-label": "Look without a style picture" },
    h("option", { value: "keyart" }, "Rich key art: detailed, cinematic light"), h("option", { value: "flat" }, "Flat cartoon: bold outlines, flat colours"));
  const lookBox = h("label", { class: "f" }, h("span", {}, "Look", h("span", { class: "faint" }, "when there's no style picture")), lookSel);
  const go = h("button", { class: "btn primary", onclick: async () => {
    if (!idea.value.trim()) return toast("Write the story or idea first", true);
    go.disabled = true;
    try {
      const r = await api("POST", "/api/films", { title: title.value.trim() || idea.value.trim().slice(0, 40) });
      const params = { step: "new", idea: idea.value, notes: notes.value, shots: +shots.value || 6,
        narrator: narrOn.checked, dialogue: talkOn.checked, music: musicOn.checked, look: lookSel.value };
      const file = styleIn.files[0];
      if (file) {
        toast("Uploading the style picture…");
        const ext = (file.name.match(/\.(png|jpe?g)$/i) || [".png"])[0].toLowerCase();
        const up = await fetch(`/api/films/${r.name}/upload?name=style${ext}`, { method: "POST", body: file, headers: { "Content-Type": file.type || "application/octet-stream" } });
        const data = await up.json(); if (!up.ok) throw new Error((data.errors || []).join("\n"));
        params.style_image = data.path;
      }
      await api("POST", `/api/films/${r.name}/run`, params);
      location.hash = `#/film/${r.name}/story`;
    } catch (e) { toast(e.message, true); go.disabled = false; }
  } }, "Write the story");
  $app.replaceChildren(
    h("h1", {}, "New film"),
    h("p", { class: "dim" }, "Spike writes the shot list on this Mac with the local model. Then you make it scene by scene (picture, motion, sound, lines, preview), approving each part before the next, and finish with the music and the final film."),
    h("div", { class: "card stack" },
      h("label", { class: "f" }, h("span", {}, "Your story"), idea),
      h("label", { class: "f" }, h("span", {}, "Reference notes"), notes),
      h("div", { class: "f" }, h("span", { class: "small dim" }, "Style picture"), styleBox),
      lookBox,
      h("div", { class: "f" }, h("span", { class: "small dim" }, "In this film"), h("div", { class: "row", style: "gap:16px;flex-wrap:wrap" }, narrBox, talkBox, musicBox)),
      h("div", { class: "grid2" }, h("label", { class: "f" }, h("span", {}, "Title (optional)"), title),
        h("label", { class: "f" }, h("span", {}, "Shots", h("span", { class: "faint" }, "5 s each")), shots)),
      h("div", { class: "row" }, go, h("span", { class: "small faint" }, "About a minute"))),
    h("h2", {}, "Films"),
    films.length ? h("div", { class: "films" }, films.map((f) =>
      h("button", { class: "film-card", onclick: () => { location.hash = `#/film/${f.name}/${f.film ? "film" : "story"}`; } },
        f.poster ? h("img", { class: "thumb", src: `/media/${f.name}/${f.poster}`, alt: "", loading: "lazy" }) : h("div", { class: "empty-media" }, "No storyboard yet"),

async function loadFilm(quiet) {
  try {
    const f = await api("GET", `/api/films/${S.name}`);
    const wasRunning = S.film?.job?.running;
    const sig = JSON.stringify({ ...f, job: f.job && { step: f.job.step, running: f.job.running, rc: f.job.rc } });
    // A poll that changed nothing on disk, or arrives while something is playing, only refreshes the job bar.
    const playing = [...document.querySelectorAll("audio,video")].some((m) => !m.paused);
    if (quiet && S.film && (sig === S.sig || playing)) {
      S.film.job = f.job; if (sig !== S.sig) S.pending = true;
      document.getElementById("jobbar")?.replaceWith(jobBar());
      clearTimeout(S.poll); S.poll = setTimeout(() => loadFilm(true), f.job?.running ? 2500 : 15000);
      return;
    }
    S.sig = sig; S.pending = false;
    S.film = f;
    if (!S.dirty) { S.doc = f.doc ? clone(f.doc) : null; S.rawText = f.toml; }
    if (wasRunning && f.job && !f.job.running) {
      toast(f.job.rc === 0 ? `${STEP_NAMES[f.job.step] || f.job.step}: done` : `${STEP_NAMES[f.job.step] || f.job.step} failed; see the log`, f.job.rc !== 0);
      if (f.job.rc !== 0) S.logOpen = true;
    }
    renderFilm(quiet);
  } catch (e) {
    if (e.status === 404) { toast("No such film", true); location.hash = ""; return; }
    toast(e.message, true);
  }
  clearTimeout(S.poll);
  S.poll = setTimeout(() => loadFilm(true), S.film?.job?.running ? 2500 : 15000);
}

// A real picture laid onto a screen in the scene (a web page on the laptop), so its words stay readable.
// Tap the screen's 4 corners on the picture; it is warped onto them when the film is put together.
function screenEditor(s) {
  const doc = S.film.doc.shot.find((x) => x.id === s.id) || {};
  const cur = doc.screen || null;
  const pics = [...new Set([...(doc.pictures || []).map((p) => p.file), ...(S.film.references || [])])].filter((f) => /\.(png|jpe?g)$/i.test(f));
  let pts = cur ? cur.corners.map(([x, y]) => [x, y]) : [];
  const sel = h("select", {}, h("option", { value: "" }, "Choose a picture…"), pics.map((f) => h("option", { value: f }, f.replace(/^reference\//, ""))));
  sel.value = cur?.picture || pics.find((f) => (doc.pictures || []).some((p) => p.file === f)) || "";
  const top = h("input", { type: "number", min: 0, max: 0.5, step: 0.01, value: cur?.top || 0, style: "width:6rem" });
  const NS = "http://www.w3.org/2000/svg";

  svg.setAttribute("viewBox", "0 0 1 1"); svg.setAttribute("preserveAspectRatio", "none");
  svg.style.cssText = "position:absolute;inset:0;width:100%;height:100%;pointer-events:none";
  const order = (q) => {    // top-left, top-right, bottom-right, bottom-left, whatever order they were tapped in
    const byY = [...q].sort((a, b) => a[1] - b[1]);
    const [tl, tr] = byY.slice(0, 2).sort((a, b) => a[0] - b[0]), [bl, br] = byY.slice(2).sort((a, b) => a[0] - b[0]);
    return [tl, tr, br, bl];
  };
  const draw = () => {
    svg.replaceChildren();
    const q = pts.length === 4 ? order(pts) : pts;
    if (q.length > 1) {
      const poly = document.createElementNS(NS, "polygon");
      poly.setAttribute("points", q.map(([x, y]) => `${x},${y}`).join(" "));
      poly.setAttribute("style", `fill:${q.length === 4 ? "rgba(70,200,180,.25)" : "none"};stroke:#46c8b4;stroke-width:.004`);
      svg.append(poly);
    }
    for (const [x, y] of q) {
      const c = document.createElementNS(NS, "circle");
      c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", ".008"); c.setAttribute("style", "fill:#fff;stroke:#111;stroke-width:.003");
      svg.append(c);
    }
    hint.textContent = pts.length < 4 ? `Tap corner ${pts.length + 1} of 4 of the screen` : "Screen marked. Save it, or start over.";
    save.disabled = pts.length !== 4 || !sel.value;
  };

  img.addEventListener("click", (e) => {

  const save = h("button", { class: "btn small", onclick: () => saveShot(s.id, (x) => {
    x.screen = { picture: sel.value, corners: order(pts), ...(Number(top.value) ? { top: Number(top.value) } : {}) };
  }, "Screen saved; it shows in the film").catch((e) => toast(e.message, true)) }, "Save screen");
  sel.addEventListener("change", draw);
  const el = h("details", { class: "sec", open: cur ? true : null },
    h("summary", {}, h("span", { class: "sum-title" }, "Real screen"), h("span", { class: "sum-sub" }, cur ? cur.picture.replace(/^reference\//, "") : "none")),
    h("div", { class: "body" },
      h("p", { class: "small dim" }, "Lay a real picture (a web page, an app) onto a screen in this scene, so its words are sharp and readable. Add the picture above, choose it here, then tap the screen's 4 corners."),
      h("label", { class: "f" }, h("span", {}, "Picture"), sel),
      h("div", { style: "position:relative" }, img, svg),
      h("div", { class: "row" }, hint, h("span", { class: "spacer" }),
        h("button", { class: "btn small ghost", onclick: () => { pts = []; draw(); } }, "Start over")),
      h("label", { class: "row", style: "gap:10px" }, h("span", { class: "small" }, "Skip from the top"), top,
        h("span", { class: "small faint" }, "0–0.5 of the picture, e.g. a phone's address bar")),
      h("div", { class: "row" }, cur ? h("button", { class: "btn small ghost danger", onclick: () => saveShot(s.id, (x) => { delete x.screen; }, "Screen removed").catch((e) => toast(e.message, true)) }, "Remove screen") : null,
        h("span", { class: "spacer" }), save)));

  const seg = h("div", { class: "seg", role: "group", "aria-label": "Fill the rest" },
    h("button", { "aria-pressed": fill === "slow", onclick: (e) => { fill = "slow"; setSeg(e); } }, "Slow down"),
    h("button", { "aria-pressed": fill === "hold", onclick: (e) => { fill = "hold"; setSeg(e); } }, "Hold last frame"));
  const apply = async () => {
    try {
      await saveShot(s.id, (x) => { if (end >= L - 0.01) { delete x.end; delete x.fill; } else { x.end = Math.round(end * 10) / 10; x.fill = fill; } },
        end >= L - 0.01 ? "Using the whole clip" : `Ending at ${end.toFixed(1)} s`);
      run("video", { shot: s.id });
    } catch (e) { toast(e.message, true); }
  };
  return h("details", { class: "sec", open: doc.end != null || null }, h("summary", {}, h("span", { class: "sum-title" }, "Trim the end"),
      h("span", { class: "sum-sub" }, doc.end != null ? `ends at ${doc.end} s, ${doc.fill === "hold" ? "last frame held" : "slowed down"}` : "whole clip")),
    h("div", { class: "body" },
      h("p", { class: "small dim" }, "Drag to the last good moment; the picture shows that frame of the whole take. The shot stays 5 seconds: the part you keep is slowed down to fill it, or its last frame is held."),
      vid, h("div", { class: "row" }, h("span", { class: "small" }, "End at"), h("div", { style: "flex:1;min-width:0" }, range), val),
      h("div", { class: "row" }, seg, h("span", { class: "spacer" }), h("button", { class: "btn primary", disabled: busy() || S.dirty, onclick: apply }, "Apply"))));
}
async function useTake(shot, seed) {
  if (S.dirty) return toast("Save or undo your Story edits first", true);
  try { S.film = await api("POST", `/api/films/${S.name}/use`, { shot, seed, kind: "motion" }); S.doc = clone(S.film.doc); S.rawText = S.film.toml; toast(`${shot}: using take ${seed}`); renderFilm(true); }
  catch (e) { toast(e.message, true); }
}

function soundPart(s, st) {
  const vid = s.clip ? h("video", { src: media(s.clip), poster: s.still ? media(s.still) : null, playsinline: true, muted: true, preload: "metadata" }) : null;
  const aud = s.sfx ? h("audio", { src: media(s.sfx), controls: true, preload: "none" }) : null;
  if (vid && aud) {   // play picture and sound together
    aud.addEventListener("play", () => { vid.currentTime = aud.currentTime; vid.play(); });
    aud.addEventListener("pause", () => vid.pause());
    aud.addEventListener("seeked", () => { vid.currentTime = aud.currentTime; });
  }
  return [
    vid, aud ? h("div", { class: st.done ? "" : "stale" }, aud) : null,
    inlineEdit("Sounds in this scene (no music, no speech)", s.sfx_text, (v) => saveShot(s.id, (x) => { if (v.trim()) x.sfx = v; else delete x.sfx; }, "Saved")),
    s.sfx_text.trim() ? h("div", { class: "row" }, runBtn(s.sfx ? "Make the sound again" : "Make the sound", "sound", { shot: s.id }, !st.done),
      h("span", { class: "small faint" }, "About 30 s.")) : null,
  ];
}

function linesPart(s, st) {
  const f = S.film, chk = f.checks || {}, doc = f.doc;
  const score = (v) => v == null ? null : h("span", { class: "chip " + (v >= 0.8 ? "ok" : "bad") }, v >= 0.8 ? `heard ✓ ${v}` : `unclear ${v}`);
  const heard = (text) => text ? h("p", { class: "small dim heard" }, "Heard: “", text, "”") : null;
  const out = [];
  if (doc.narrator) {
    out.push(h("div", { class: "line" }, h("div", { class: "row" }, h("span", { class: "who" }, "Narrator"), h("span", { class: "spacer" }), s.narration ? score(chk.narration?.[s.id]) : null),
      s.narration && s.narration_audio ? h("audio", { src: media(s.narration_audio), controls: true, preload: "none" }) : null,
      s.narration ? heard(s.narration_heard) : null,
      inlineEdit("Narration (leave empty for none)", s.narration, (v) => saveShot(s.id, (x) => { if (v.trim()) x.narration = v.trim(); else delete x.narration; }, "Saved; record again to hear it"), 1)));
  }
  if (doc.captions !== false) {
    const own = (doc.shot.find((x) => x.id === s.id) || {}).caption;
    out.push(inlineEdit("On-screen caption (empty for none; the narration if never set)", own ?? s.narration ?? "",
      (v) => saveShot(s.id, (x) => { if (v.trim() === (x.narration || "").trim()) delete x.caption; else x.caption = v.trim(); }, "Caption saved; it shows in the film"), 1));
  }
  const voiced = Object.entries(doc.characters || {}).filter(([, c]) => typeof c === "object" && c.voice).map(([n]) => n);
  (s.dialogue || []).forEach((l, k) => {
    out.push(h("div", { class: "line" }, h("div", { class: "row" }, h("span", { class: "who" }, l.speaker), l.emotion ? h("span", { class: "small faint" }, l.emotion) : null,
        h("span", { class: "spacer" }), score(chk.dialogue?.[`${s.id}-${k + 1}`]),
        h("button", { class: "btn small ghost danger", "aria-label": "Remove line", onclick: () => {
          if (confirm(`Remove ${l.speaker}'s line?`)) saveShot(s.id, (x) => { x.dialogue.splice(k, 1); if (!x.dialogue.length) delete x.dialogue; }, "Line removed").catch((e) => toast(e.message, true));
        } }, "✕")),
      s.dialogue_audio[k] ? h("audio", { src: media(s.dialogue_audio[k]), controls: true, preload: "none" }) : null,
      heard(s.dialogue_heard?.[k]),
      inlineEdit("Line", l.line, (v) => saveShot(s.id, (x) => { x.dialogue[k].line = v.trim(); }, "Saved; record again to hear it"), 1)));
  });
  if (voiced.length) {
    const who = h("select", { "aria-label": "Speaker" }, voiced.map((n) => h("option", { value: n }, n)));
    const said = h("input", { type: "text", placeholder: "the line, exactly as it should be said" });
    out.push(h("div", { class: "row" }, h("div", { style: "width:9rem" }, who), h("div", { style: "flex:1;min-width:0" }, said),
      h("button", { class: "btn small", onclick: () => {
        if (!said.value.trim()) return toast("Write the line first", true);
        saveShot(s.id, (x) => { (x.dialogue ||= []).push({ speaker: who.value, line: said.value.trim(), emotion: "" }); }, "Line added").catch((e) => toast(e.message, true));
      } }, "Add line")));
  }
  if (!doc.narrator && !voiced.length) out.push(h("p", { class: "small dim" }, "No one speaks in this film. Add a narrator or give a character a voice on the Story step."));
  const any = s.narration || (s.dialogue || []).length;
  if (any) {
    out.push(h("p", { class: "small faint" }, "The narrator speaks first, then the characters, inside this scene's 5 seconds; keep it to about 12 words."));
    out.push(h("div", { class: "row" }, runBtn((s.narration_audio || s.dialogue_audio.length) ? "Record again" : "Record", "voices", { shot: s.id }, !st.done)));
  }
  return out;
}

function previewPart(s, st) {
  return [
    s.preview ? h("div", { class: st.done ? "" : "stale" }, h("video", { src: media(s.preview), poster: s.still ? media(s.still) : null, controls: true, playsinline: true, preload: "metadata" }))
      : h("div", { class: "empty-media" }, "Not put together yet"),
    h("p", { class: "small dim" }, "The scene with its own sound and lines at the film's loudness (music comes at the end). Watch it through: anything wrong, reopen that part above."),
    h("div", { class: "row" }, runBtn(s.preview ? "Put together again" : "Put the scene together", "scene", { shot: s.id }, !st.done)),
  ];
}

async function useRetake(shot, seed) {
  if (S.dirty) return toast("Save or undo your Story edits first", true);
  try { S.film = await api("POST", `/api/films/${S.name}/use`, { shot, seed }); S.doc = clone(S.film.doc); S.rawText = S.film.toml; toast(`${shot}: using version ${seed}`); renderFilm(true); }
  catch (e) { toast(e.message, true); }
}

// ---- music tab ------------------------------------------------------------------------------------
function musicTab() {
  const f = S.film, sc = f.score;
  if (!f.doc?.music) return h("div", { class: "stack" }, h("h1", {}, "Music"), h("p", { class: "dim" }, "This story has no score. Add one under Music on the Story step, or approve to go on without music."), gateBar("music"));
  const pin = async (take) => {
    if (S.dirty) return toast("Save the story first", true);
    try { S.film = await api("POST", `/api/films/${S.name}/take`, { take }); S.doc = clone(S.film.doc); S.rawText = S.film.toml;
      toast(take == null ? "Back to picking the best take automatically" : `Take ${take} chosen`); renderFilm(true); }
    catch (e) { toast(e.message, true); }
  };
  return h("div", { class: "stack" },
    h("h1", {}, "Music"),
    h("p", { class: "dim" }, `${f.doc.music.caption}`),
    h("div", { class: "hint" }, sc.pinned != null ? `Take ${sc.pinned} is pinned.` : `Spike makes ${f.doc.music.takes || 8} takes at a tempo locked to the cuts and keeps the one that best follows the story's intensity.`,
      sc.pinned != null ? h("button", { class: "btn small ghost", style: "margin-left:8px", onclick: () => pin(null) }, "Pick automatically") : null),
    sc.takes.length ? h("div", { class: "stack" }, sc.takes.map((t) => h("div", { class: "card take" },
      h("div", { class: "row" }, h("b", {}, `Take ${t.seed}`), t.score != null ? h("span", { class: "small dim" }, `fit ${Number(t.score).toFixed(2)}`) : null,
        t.seed === sc.chosen ? h("span", { class: "chip ok" }, "in the film") : null, t.seed === sc.pinned ? h("span", { class: "chip acc" }, "pinned") : null,
        h("span", { class: "spacer" }), t.seed !== sc.pinned ? h("button", { class: "btn small", onclick: () => pin(t.seed) }, "Use this take") : null),
      h("audio", { src: media(t.url), controls: true, preload: "none" }))))
      : h("p", { class: "dim" }, "The takes appear here once they're made: about 2 minutes for all of them."),
    gateBar("music", runBtn(sc.takes.length ? "Remake music" : "Make music", "music", {}, !sc.takes.length)));
}

// ---- film tab -------------------------------------------------------------------------------------
// How loud each layer plays in the film, in percent (spike-animate's defaults when the story says nothing).
const LEVELS = [["sound", "Sound effects", 20], ["music", "Music", 20], ["voices", "Voices", 50]];
function levelsCard() {
  const f = S.film, now = { ...Object.fromEntries(LEVELS.map(([k, , d]) => [k, d])), ...(f.doc?.mix || {}) }, pick = { ...now };
  const mix = stepOf("film").unlocked && !busy();
  const save = h("button", { class: "btn small", disabled: true, onclick: async () => {
    try { await saveDoc((doc) => { doc.mix = { ...pick }; }, mix ? "Levels saved; mixing again" : "Levels saved; they apply when the film is mixed");
      if (mix) run("film"); } catch (e) { toast(e.message, true); } } }, mix ? "Save and mix again" : "Save levels");
  return h("div", { class: "card stack", style: "gap:10px" }, h("h3", { style: "margin:0" }, "Loudness"),
    h("span", { class: "small dim" }, "How loud each part plays in the film. 100% is how films sounded before."),
    LEVELS.map(([k, name]) => {
      const out = h("span", { class: "mono small", style: "min-width:3.5em;text-align:right" }, `${now[k]}%`);
      const r = h("input", { type: "range", min: 0, max: 100, step: 5, value: now[k], "aria-label": `${name} level`,
        oninput: (e) => { pick[k] = Number(e.target.value); out.textContent = `${pick[k]}%`;
          save.disabled = LEVELS.every(([x]) => pick[x] === now[x]); } });
      return h("label", { class: "row", style: "gap:12px" }, h("span", { style: "min-width:8em" }, name), r, out);
    }),
    h("div", { class: "row" }, h("span", { class: "spacer" }), save));
}

// Captions, the end card and one grade: applied when the film is put together, so no scene is redone.
function finishCard() {
  const f = S.film, doc = f.doc || {};
  const mixNow = stepOf("film").unlocked && !busy();
  const cap = h("input", { type: "checkbox", checked: doc.captions !== false });
  const text = h("input", { type: "text", value: doc.end_card?.text || "", placeholder: "e.g. Put your agent to work." });
  const sub = h("input", { type: "text", value: doc.end_card?.sub || "", placeholder: "e.g. BotGuild.ai" });
  const g = { warmth: 0, saturation: 1, contrast: 1, ...(doc.grade || {}) };
  let place = doc.end_card?.place || "middle";
  const placeSeg = h("div", { class: "seg", role: "group", "aria-label": "End card height" },
    [["top", "High"], ["middle", "Middle"], ["bottom", "Low"]].map(([v, label]) => h("button", { type: "button", "aria-pressed": place === v,
      onclick: (e) => { place = v; for (const b of e.target.parentNode.children) b.setAttribute("aria-pressed", String(b === e.target)); } }, label)));
  const slider = (k, name, min, max, step) => {
    const out = h("span", { class: "mono small", style: "min-width:3.5em;text-align:right" }, String(g[k]));
    const r = h("input", { type: "range", min, max, step, value: g[k], "aria-label": name,
      oninput: (e) => { g[k] = Number(e.target.value); out.textContent = String(g[k]); } });
    return h("label", { class: "row", style: "gap:12px" }, h("span", { style: "min-width:8em" }, name), r, out);
  };
  const save = h("button", { class: "btn small", onclick: async () => {
    try {
      await saveDoc((d) => {
        if (cap.checked) delete d.captions; else d.captions = false;
        if (text.value.trim()) { d.end_card = { ...(d.end_card || {}), text: text.value.trim(), sub: sub.value.trim() }; if (place === "middle") delete d.end_card.place; else d.end_card.place = place; } else delete d.end_card;
        const grade = Object.fromEntries(Object.entries(g).filter(([k, v]) => v !== { warmth: 0, saturation: 1, contrast: 1 }[k]));
        if (Object.keys(grade).length) d.grade = grade; else delete d.grade;
      }, mixNow ? "Saved; putting the film together again" : "Saved; it applies when the film is put together");
      if (mixNow) run("film");
    } catch (e) { toast(e.message, true); }
  } }, mixNow ? "Save and make the film again" : "Save");
  return h("div", { class: "card stack", style: "gap:10px" }, h("h3", { style: "margin:0" }, "Finish"),
    h("span", { class: "small dim" }, "Words on screen and one colour grade over every scene. Changing these never redoes a scene."),
    h("label", { class: "row", style: "gap:10px" }, cap, h("span", {}, "Captions: each scene's narration, or its own caption (set in its Lines)")),
    h("label", { class: "f" }, h("span", {}, "End card", h("span", { class: "faint" }, "over the last scene, which then holds")), text),
    h("label", { class: "f" }, h("span", {}, "Second line", h("span", { class: "faint" }, "smaller, e.g. the website")), sub),
    h("div", { class: "row", style: "gap:10px" }, h("span", { class: "small dim" }, "End card sits"), placeSeg, h("span", { class: "small faint" }, "keep it clear of a face")),
    slider("warmth", "Warmth", -0.5, 0.5, 0.05), slider("saturation", "Colour", 0.5, 1.6, 0.05), slider("contrast", "Contrast", 0.8, 1.3, 0.01),
    h("div", { class: "row" }, h("span", { class: "spacer" }), save));
}

function filmTab() {
  const f = S.film, c = f.checks || {};
  const allLines = [...Object.values(c.narration || {}), ...Object.values(c.dialogue || {})];
  const weak = allLines.filter((v) => v < 0.8).length;
  const over = Object.keys(c.dialogue_overflow || {}).length;
  return h("div", { class: "stack" },
    h("h1", {}, f.title),
    f.idea ? h("p", { class: "dim", style: "font-family:var(--display);font-style:italic" }, `“${f.idea}”`) : null,
    f.film ? h("video", { class: "film", src: media(f.film), poster: f.shots[0]?.still ? media(f.shots[0].still) : null, controls: true, playsinline: true, preload: "metadata" })
      : h("div", { class: "empty-media" }, "Not mixed yet"),
    f.film ? h("div", { class: "row" }, h("a", { class: "btn ghost", href: media(f.film), download: "" }, "Download")) : null,
    f.film ? h("div", { class: "card stack", style: "gap:8px" },
      h("h3", { style: "margin:0" }, "Checks"),
      h("div", { class: "row" },
        allLines.length ? h("span", { class: "chip " + (weak ? "bad" : "ok") }, weak ? `${weak} line(s) hard to hear` : `all ${allLines.length} lines heard`) : null,
        c.final_narration != null ? h("span", { class: "chip " + (c.final_narration >= 0.8 ? "ok" : "bad") }, `speech in final mix ${c.final_narration}`) : null,
        over ? h("span", { class: "chip bad" }, `${over} shot(s) with dialogue past the cut`) : allLines.length ? h("span", { class: "chip ok" }, "dialogue fits its shots") : null,
        c.length ? h("span", { class: "chip" }, `${c.length.film} s`) : null,
        f.score.chosen != null ? h("span", { class: "chip" }, `music take ${f.score.chosen}`) : null)) : null,
    levelsCard(),
    finishCard(),
    f.board ? h("div", {}, h("h2", {}, "Storyboard"), h("img", { src: media(f.board), alt: "Storyboard", loading: "lazy" })) : null,
    gateBar("film", runBtn(f.film ? "Mix again" : "Mix the film", "film", {}, !f.film)));
}

route();
</script>
